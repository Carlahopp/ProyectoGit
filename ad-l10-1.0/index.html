<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <title>AD-18 - Web Storage Lab</title>
  <style>
    body{font-family:'Inter', sans-serif; background:#fbfbfd; color:#0a0a0b; margin:0; padding:24px;}
    .hero{background:#0a0a0f; color:white; border-radius:28px; padding:40px;
      background-image: radial-gradient(circle at 20% 20%, rgba(139,92,246,0.25), transparent 40%),
                        radial-gradient(circle at 80% 80%, rgba(236,72,153,0.18), transparent 40%);}
    .badge-live{background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.1); border-radius:100px; padding:6px 14px; font-size:11px; letter-spacing:1px; font-family:'JetBrains Mono', monospace; display:inline-block;}
    .hero h1{font-size:48px; font-weight:800; letter-spacing:-2px; line-height:0.9; margin:16px 0;}
    .hero h1 span{background:linear-gradient(90deg,#8b5cf6,#ec4899); -webkit-background-clip:text; -webkit-text-fill-color:transparent;}
    .hero p{color:#a1a1aa; max-width:480px;}

    #controls{display:flex; gap:10px; margin:28px 0;}
    .btn-mini{border-radius:10px; padding:10px 16px; font-weight:600; font-size:13px; border:1px solid #e4e4e7; background:white; cursor:pointer;}
    .btn-mini.black{background:#111; color:white; border-color:#111;}

    /* ESTO ES LO IMPORTANTE - FILAS, NO GRID */
    #list-items{display:flex; flex-direction:column; gap:12px;}
    .color-row{display:flex; background:white; border:1px solid #e4e4e7; border-radius:16px; overflow:hidden; cursor:pointer; transition:all .25s; height:78px;}
    .color-row.expanded{height:320px;}
    .color-left{min-width:140px; display:flex; align-items:center; justify-content:center; color:white; font-weight:800; font-family:'JetBrains Mono', monospace;}
    .color-center{flex:1; padding:14px 18px; display:flex; flex-direction:column; justify-content:center;}
    .c-name{font-weight:700; text-transform:uppercase; font-size:14px;}
    .c-year{color:#71717a; font-weight:400; margin-left:6px;}
    .c-pantone{font-size:12px; color:#71717a; font-family:'JetBrains Mono', monospace;}
    .c-image-preview{height:0; overflow:hidden; opacity:0; transition:all .3s;}
    .color-row.expanded .c-image-preview{height:220px; opacity:1; margin-top:12px;}
    .c-image-preview img{width:100%; height:100%; object-fit:contain; border-radius:10px; background:#f9f9fb;}
    .color-right{width:60px; display:flex; align-items:center; justify-content:center; color:#a1a1aa; font-size:20px;}
  </style>
</head>
<body>
  <div class="container">
    <div class="hero">
      <div class="badge-live">● WEB STORAGE API</div>
      <h1>Taylor Swift Eras<br><span>Color Lab</span></h1>
      <p>AD-18: Fetch + localStorage. Los colores se guardan localmente con JSON.stringify y se cargan con JSON.parse.</p>
    </div>
    <div id="controls"></div>
    <main id="list-items"><p>Conectando con ReqRes...</p></main>
  </div>

<script>
const itemsContainer = document.querySelector("#list-items");
const controlsContainer = document.querySelector("#controls");

function addItem(item) {
  const card = document.createElement("div");
  card.className = "color-row";
  const fotosPorId = {
    1: "98B2D1-TS.jpg", 2: "C74375-TS.jpg", 3: "BF1932-TS.jpg",
    4: "7BC4C4-TS.jpg", 5: "E2583E-TS.jpg", 6: "53B0AE-TS.jpg"
  };
  const imgUrl = "js/" + fotosPorId[item.id];
  card.innerHTML = `
    <div class="color-left" style="background:${item.color}">${item.color}</div>
    <div class="color-center">
      <div class="c-name">${item.name} <span class="c-year">${item.year}</span></div>
      <div class="c-pantone">PANTONE ${item.pantone_value}</div>
      <div class="c-image-preview"><img src="${imgUrl}" alt="${item.name}"></div>
    </div>
    <div class="color-right">↗</div>
  `;
  card.addEventListener('click', () => card.classList.toggle('expanded'));
  itemsContainer.append(card);
}

function fetchColorsList() {
  fetch('https://reqres.in/api/unknown').then(r=>r.json()).then(res=>{
    localStorage.setItem('colorsList', JSON.stringify(res.data));
    itemsContainer.innerHTML=''; res.data.forEach(c=>addItem(c));
  });
}
function loadColorsFromStorage() {
  const s = localStorage.getItem('colorsList');
  if(s){ itemsContainer.innerHTML=''; JSON.parse(s).forEach(c=>addItem(c)); } 
  else { fetchColorsList(); }
}

const btnCargar = document.createElement('button'); btnCargar.className='btn-mini black'; btnCargar.textContent='Recargar API'; btnCargar.onclick=fetchColorsList;
const btnBorrar = document.createElement('button'); btnBorrar.className='btn-mini'; btnBorrar.textContent='Borrar'; btnBorrar.onclick=()=>{ localStorage.removeItem('colorsList'); itemsContainer.innerHTML='<p>Storage borrado.</p>'; };
controlsContainer.append(btnCargar, btnBorrar);
document.addEventListener('DOMContentLoaded', loadColorsFromStorage);
</script>
</body>
</html>
